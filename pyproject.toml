[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ott-agent"
version = "0.1.0"
description = "One User, One Agent: a per-viewer lifecycle agent that decides, acts, verifies and measures."
authors = [{ name = "Rajveer Sharma" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
